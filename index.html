<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Elo Calculator</title>
    </head>

    <body>
        <h1>Elo calculator</h1>
        <p>Enter both players previous elo ratings below and select the winner.</p>
        <form id="input">
            <input 
                type="number" 
                class="text" 
                id="elo1" 
                placeholder="Player 1's Rating" 
                inputmode="numeric" 
                step="0.1"
                min="1000">
            <input 
                type="number" 
                class="text" 
                id="elo2" 
                placeholder="Player 2's Rating" 
                inputmode="numeric"
                step="0.1"
                min="1000"><br>
            <label class="option">
                <input type="radio" name="winLose" value="win">
                <span>Player 1</span>
            </label>
            <label class="option">
                <input type="radio" name="winLose" value="lose">
                <span>Player 2</span>
            </label>
            <label class="option">
                <input type="radio" name="winLose" value="draw">
                <span>Draw</span>
            </label><br>
            <input class="submit" type="submit">       
        </form>
        <p id="message"></p>

        <table id="output" class="hidden">
            <thead>
                <tr>
                    <th></th>
                    <th>Player 1</th>
                    <th>Player 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Initial Rating</td>
                    <td id="initial1"></td>
                    <td id="initial2"></td>
                </tr>
                <tr>
                    <td>Change</td>
                    <td id="change1"></td>
                    <td id="change2"></td>
                </tr>
                <tr>
                    <td>New Rating</td>
                    <td id="output1"></td>
                    <td id="output2"></td>
                </tr>
            </tbody>
        </table>

        <script src="script.js"></script>
    </body>
</html>
