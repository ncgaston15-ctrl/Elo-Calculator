<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Elo Calculator</title>
    </head>

    <body>
        <h1>Elo calculator</h1>
        <form id="input">
            <input 
                type="number" 
                class="text" 
                id="elo1" 
                placeholder="Player 1's Elo" 
                inputmode="numeric" 
                step="0.1"
                min="1000"><br>
            <input 
                type="number" 
                class="text" 
                id="elo2" 
                placeholder="Player 2's Elo" 
                inputmode="numeric"
                step="0.1"
                min="1000"><br>
            <input type="radio" id="win" name="winLose" value="win">
            <label for="win">Player 1</label>
            <input type="radio" id="lose" name="winLose" value="lose">
            <label for="lose">Player 2</label>
            <input type="radio" name="winLose" value="draw">
            <label for="lose">Draw</label><br>
            <input class="submit" type="submit">       
        </form>
        <p id="message"></p>

        <table id="output" class="hidden">
            <thead>
                <tr>
                    <th></th>
                    <th>Elo</th>
                    <th>Change</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Player 1</td>
                    <td id="output1"></td>
                    <td id="change1"></td>
                </tr>
                <tr>
                    <td>Player 2</td>
                    <td id="output2"></td>
                    <td id="change2"></td>
                </tr>
            </tbody>
        </table>

        <script src="script.js"></script>
    </body>
</html>
